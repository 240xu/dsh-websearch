# ── dsh-unified-search: free aggregated web search ───────────────────────
# Registers provider id "unified" that fans out to 6 backends concurrently:
#   keyless:    exa, parallel, ddg
#   key-gated:  deepseek, anthropic, openai  (activate when their API key is set)
#
# web-search-deepseek stays disabled because the unified plugin supersedes it.
# web.searchProvider pins the built-in web_search tool onto the unified provider.
- id: unified-search
  name: "@deepseek-ai/dsh-unified-search"
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  disabled: true
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: unified
