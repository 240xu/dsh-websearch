# ── dsh-websearch v2.0: unified free web search ───────────────────────
# Registers provider id "unified" that fans out to 11 backends concurrently:
#   keyless:    exa, parallel, ddg, searxng
#   key-gated:  deepseek, anthropic, openai, brave, tavily, serper, mojeek
#               (activate when their API key is set via Settings > Unified Search)
#
# web-search-deepseek stays disabled because the unified plugin supersedes it.
# web.searchProvider pins the built-in web_search tool onto the unified provider.
- id: unified-search
  name: "@deepseek-ai/dsh-websearch"
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  disabled: true
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: unified
